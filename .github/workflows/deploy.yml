name: Deploy brand assets

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-assets
  # Queue pushes rather than killing a deploy that is already uploading.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Regenerate from brand.source.json + the files on disk, then fail if the
      # committed output was stale. Keeps public/ honest without a build step
      # on the Cloudflare side.
      - name: Build and verify manifest is current
        run: npm run check

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
